{% extends "base.html" %}
{% block title %}Cronograma{% endblock %}

{% block content %}
<h1 class="mb-3">Cronograma — {{ disciplina.nome }} ({{ disciplina.turma }})</h1>

<table class="table table-sm table-bordered align-middle">
  <thead class="table-light">
    <tr>
      <th>Data</th>
      <th>Conteúdo</th>
      <th>Atividades</th>
      <th>Presença</th>
      <th>Observações</th>
      <th>Sem Aula</th>
      <th>Reposição</th>
      <th></th>
    </tr>
  </thead>

  <tbody>
    {% for a in aulas %}
    <tr class="{% if a.sem_aula %}table-danger{% endif %}">
      <form action="{{ request.url_for('api/aulas/{aula_id}', aula_id=a.id) }}" method="post">

        <!-- DATA -->
        <td>{{ a.data }}</td>

        <!-- CONTEÚDO -->
        <td>
          <input class="form-control form-control-sm" name="conteudo" value="{{ a.conteudo }}">
        </td>

        <!-- ATIVIDADES -->
        <td>
          <input class="form-control form-control-sm" name="atividades" value="{{ a.atividades }}">
        </td>

        <!-- PRESENÇA (dropdown) -->
        <td>
          <select name="presenca" class="form-select form-select-sm">
            <option value="" {% if a.presenca == "" %}selected{% endif %}>Não registrada</option>
            <option value="P" {% if a.presenca == "P" %}selected{% endif %}>Presente</option>
            <option value="F" {% if a.presenca == "F" %}selected{% endif %}>Faltou</option>
          </select>
        </td>

        <!-- OBSERVAÇÕES -->
        <td>
          <input class="form-control form-control-sm" name="observacoes" value="{{ a.observacoes }}">
        </td>

        <!-- SEM AULA -->
        <td class="text-center">
          <input type="hidden" name="sem_aula" value="false">
          <input class="form-check-input" type="checkbox" name="sem_aula" value="true"
                 {% if a.sem_aula %}checked{% endif %}>
        </td>

        <!-- REPOSIÇÃO -->
        <td class="text-center">
          <input type="hidden" name="reposicao" value="false">
          <input class="form-check-input" type="checkbox" name="reposicao" value="true"
                 {% if a.reposicao %}checked{% endif %}>
        </td>

        <!-- BOTÃO -->
        <td>
          <button class="btn btn-sm btn-primary" type="submit">Salvar</button>
        </td>

      </form>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
