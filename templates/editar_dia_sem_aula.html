{% extends "base.html" %}
{% block title %}Editar Dia sem Aula{% endblock %}

{% block content %}
<h1>Editar Dia sem Aula</h1>

<form method="post" action="{{ request.url_for('api/dias-sem-aula/{dia_id}/editar', dia_id=dia.id) }}">
    <div class="mb-3">
        <label class="form-label">Data</label>
        <input type="date" name="data" class="form-control"
               value="{{ dia.data }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Motivo</label>
        <input type="text" name="motivo" class="form-control"
               value="{{ dia.motivo }}" required>
    </div>

    <button class="btn btn-success">Salvar</button>
</form>
{% endblock %}
