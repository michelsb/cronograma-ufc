<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cronograma{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding-top: 20px;
            transition: transform 0.3s;
        }

        .sidebar.collapsed {
            transform: translateX(-240px);
        }

        .sidebar a {
            color: var(--sidebar-text);
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.15);
        }

        /* CONTENT */
        .content {
            margin-left: 240px;
            padding: 25px;
            transition: margin-left 0.3s;
        }

        .content.expanded {
            margin-left: 0;
        }

        /* DARK MODE VARIABLES */
        :root[data-theme="light"] {
            --sidebar-bg: #0d6efd;
            --sidebar-text: white;
            --bg-color: #f8f9fa;
            --text-color: #212529;
        }

        :root[data-theme="dark"] {
            --sidebar-bg: #1b1f23;
            --sidebar-text: #e1e1e1;
            --bg-color: #121212;
            --text-color: #e1e1e1;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
        }

        /* TOGGLE BUTTON */
        #toggleSidebar {
            position: fixed;
            bottom: 20px;   /* antes era top */
            left: 20px;     /* antes era left: 15px */
            z-index: 2000;
            transition: left 0.3s;
        }

        #toggleTheme {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 2000;
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

<button id="toggleTheme" class="btn btn-outline-secondary">🌙</button>

{% if usuario %}
<a href="/logout" class="btn btn-outline-danger" style="position: fixed; top: 15px; right: 80px; z-index: 2000;">
    Sair
</a>
<button id="toggleSidebar" class="btn btn-outline-primary">☰</button>
<div class="sidebar" id="sidebar">
    <h4 class="text-center mb-4">Cronograma UFC</h4>

    <a href="/">🏠 Início</a>
    <a href="/disciplinas">📚 Disciplinas</a>
    <a href="/dias-sem-aula">📅 Dias sem aula</a>
    <a href="/importar-texto">📥 Importar grade</a>
</div>
{% endif %}

<div class="content {% if not usuario %}expanded{% endif %}" id="content">
    
    {% include "_alertas.html" %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Sidebar toggle
    document.getElementById("toggleSidebar").onclick = () => {
        document.getElementById("sidebar").classList.toggle("collapsed");
        document.getElementById("content").classList.toggle("expanded");
    };

    // Dark mode toggle
    document.getElementById("toggleTheme").onclick = () => {
        const html = document.documentElement;
        html.dataset.theme = html.dataset.theme === "light" ? "dark" : "light";
    };

    // Remove automaticamente alertas após 4 segundos
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".auto-dismiss").forEach(alert => {
            setTimeout(() => {
                let bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
                bsAlert.close();
            }, 4000);
        });
    });

</script>
{% include "_footer.html" %}
{% block scripts %}{% endblock %}
</body>
</html>
