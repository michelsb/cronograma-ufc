{% extends "base.html" %}
{% block title %}Editar Disciplina{% endblock %}

{% block content %}
<h1>Editar Disciplina</h1>

<form method="post" action="/api/disciplinas/{{ disciplina.id }}/editar">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" value="{{ disciplina.nome }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Professor</label>
        <input type="text" name="professor" class="form-control" value="{{ disciplina.professor }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Turma</label>
        <input type="text" name="turma" class="form-control" value="{{ disciplina.turma }}" required>
    </div>

    <button class="btn btn-success">Salvar</button>
</form>
{% endblock %}
